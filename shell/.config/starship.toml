# ~/.config/starship.toml
# Fast, informative prompt

# Add a blank line between prompts
add_newline = true

# Prompt format
format = """
[╭─](dimmed) $directory$git_branch$git_status$git_state$fill$status$cmd_duration$time
[╰─](dimmed) $character"""

# Right prompt (empty for now)
right_format = """
$kubernetes$docker_context$python$nodejs$dart$rust$golang$java$lua$ruby
"""

# Command timeout (ms)
command_timeout = 500
scan_timeout = 30

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
fish_style_pwd_dir_length = 2
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"

[git_branch]
symbol = "🌱 "
format = "[ $symbol$branch(:$remote_branch) ]($style)"
style = "bold purple"
only_attached = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold yellow"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
cherry_pick = "🍒 PICKING"
rebase = "🔃 REBASING"
merge = "🔀 MERGING"
revert = "↩️  REVERTING"
bisect = "🎯 BISECTING"
am = "📦 AM"

[fill]
symbol = " "
style = "dimmed"

[status]
style = "bold red"
symbol = "✖ "
format = '[\[$symbol$status\]]($style) '
disabled = false
pipestatus = true
pipestatus_format = '[\[$pipestatus\]]($style) '

[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "bold yellow"

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"
style = "dimmed white"

# Programming languages - only show when relevant files exist
[python]
symbol = "🐍 "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\))]($style) '
style = "bold green"
pyenv_version_name = true
pyenv_prefix = ""

[nodejs]
symbol = "⬢ "
format = "[${symbol}${version}]($style) "
style = "bold green"

[dart]
symbol = "🎯 "
format = "[${symbol}${version}]($style) "
style = "bold blue"

[rust]
symbol = "🦀 "
format = "[${symbol}${version}]($style) "
style = "bold orange"

[golang]
symbol = "🐹 "
format = "[${symbol}${version}]($style) "
style = "bold cyan"

[java]
symbol = "☕ "
format = "[${symbol}${version}]($style) "
style = "bold red"

[lua]
symbol = "🌙 "
format = "[${symbol}${version}]($style) "
style = "bold blue"

[ruby]
symbol = "💎 "
format = "[${symbol}${version}]($style) "
style = "bold red"

# Infrastructure
[docker_context]
symbol = "🐳 "
format = "[${symbol}${context}]($style) "
style = "bold blue"
only_with_files = true

[kubernetes]
symbol = "☸ "
format = "[${symbol}${context}(:${namespace})]($style) "
style = "bold cyan"
disabled = false

