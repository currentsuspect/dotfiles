name: shell-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n shell/.bashrc
          find shell/.bashrc.d -type f \( -name '*.sh' -o -name '*.sh.example' \) -print0 | xargs -0 -n1 bash -n
          bash -n vps/bootstrap-apt.sh
          bash -n vps/first-boot.sh
          bash -n vps/install.sh
          bash -n vps/verify.sh
          bash -n vps/vps-doctor

      - name: Shellcheck
        run: |
          SC_FLAGS='-s bash -S warning -e SC1083,SC2001,SC2002,SC2012,SC2016,SC2046,SC2086,SC2126,SC2155,SC2162,SC2164'
          shellcheck $SC_FLAGS shell/.bashrc
          find shell/.bashrc.d -type f \( -name '*.sh' -o -name '*.sh.example' \) -print0 | xargs -0 -r shellcheck $SC_FLAGS
          shellcheck $SC_FLAGS vps/bootstrap-apt.sh vps/first-boot.sh vps/install.sh vps/verify.sh vps/vps-doctor
